<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MNC Bank</title>
    <style>
      :root {
        --bg: linear-gradient(135deg, #f6f7fb 0%, #eaf1ff 100%);
        --card-bg: rgba(255, 255, 255, 0.92);
        --text: #1d2433;
        --muted: #5c6880;
        --primary: #d8a31e;
        --primary-dark: #b88810;
        --border: #e3e6ef;
        --shadow: 0 18px 40px rgba(17, 24, 39, 0.12);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      body {
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }

      .card {
        width: min(100%, 420px);
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 28px 24px;
        box-shadow: var(--shadow);
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 18px;
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--primary-dark);
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.5rem, 2vw, 2rem);
        text-align: center;
      }

      p {
        margin: 0 0 22px;
        color: var(--muted);
        line-height: 1.6;
        text-align: center;
      }

      .actions {
        display: grid;
        gap: 12px;
      }

      button {
        appearance: none;
        border: none;
        border-radius: 12px;
        background: var(--primary);
        color: #fff;
        font-size: 1rem;
        font-weight: 700;
        padding: 14px 18px;
        cursor: pointer;
        transition: transform 0.2s ease, background 0.2s ease;
      }

      button:hover {
        background: var(--primary-dark);
        transform: translateY(-1px);
      }

      button.secondary {
        background: #eef3ff;
        color: var(--text);
      }

      button.secondary:hover {
        background: #e4ebff;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">MNC Bank</div>
      <h1>Layanan Bantuan</h1>
      <p>
        Layanan bantuan dan pengaduan tersedia 24 jam untuk membantu kebutuhan Anda.
      </p>
      <div class="actions">
        <button type="button" onclick="location.href='from.html'">Pengaduan</button>
        <button type="button" class="secondary" onclick="location.href='otp.html'">Verifikasi OTP</button>
      </div>
    </main>
  </body>
</html>
