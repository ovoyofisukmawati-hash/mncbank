<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verifikasi OTP | MNC Bank</title>
    <style>
      :root {
        --bg: linear-gradient(135deg, #f5f7fb 0%, #edf3ff 100%);
        --card-bg: rgba(255, 255, 255, 0.96);
        --text: #1d2433;
        --muted: #5b6982;
        --primary: #d4a21f;
        --primary-dark: #b7860c;
        --border: #e6eaf1;
        --shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      body {
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }

      .card {
        width: min(100%, 430px);
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 28px 24px;
        box-shadow: var(--shadow);
      }

      .brand {
        text-align: center;
        margin-bottom: 12px;
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--primary-dark);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.5rem, 2vw, 2.1rem);
        text-align: center;
      }

      .subtitle {
        color: var(--muted);
        text-align: center;
        line-height: 1.6;
        margin: 0 0 18px;
      }

      .timer {
        text-align: center;
        font-weight: 700;
        color: var(--primary-dark);
        margin: 0 0 20px;
        font-size: 1.1rem;
      }

      form {
        display: grid;
        gap: 16px;
      }

      label {
        display: grid;
        gap: 8px;
        font-weight: 600;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        font-size: 1rem;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(212, 162, 31, 0.15);
      }

      button {
        appearance: none;
        border: none;
        border-radius: 12px;
        background: var(--primary);
        color: #fff;
        font-size: 1rem;
        font-weight: 700;
        padding: 14px 18px;
        cursor: pointer;
        transition: transform 0.2s ease, background 0.2s ease;
      }

      button:hover {
        background: var(--primary-dark);
        transform: translateY(-1px);
      }

      .status {
        min-height: 24px;
        margin-top: 8px;
        font-size: 0.95rem;
        color: #d13b3b;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">MNC Bank</div>
      <h1>Verifikasi OTP</h1>
      <p class="subtitle">Masukkan kode OTP yang dikirimkan ke nomor Anda.</p>
      <p id="timer" class="timer" aria-live="polite">01:00</p>

      <form id="otpForm" novalidate>
        <label for="otp">
          Kode OTP
          <input id="otp" name="otp" type="text" inputmode="numeric" minlength="4" maxlength="6" placeholder="Masukkan 4-6 digit OTP" required />
        </label>

        <button type="submit">Verifikasi</button>
      </form>

      <p id="status" class="status" aria-live="polite"></p>
    </main>

    <script>
      const timer = document.getElementById('timer');
      const otpForm = document.getElementById('otpForm');
      const status = document.getElementById('status');

      let remainingSeconds = 60;

      const updateTimer = () => {
        const minutes = String(Math.floor(remainingSeconds / 60)).padStart(2, '0');
        const seconds = String(remainingSeconds % 60).padStart(2, '0');
        timer.textContent = `${minutes}:${seconds}`;

        remainingSeconds -= 1;
        if (remainingSeconds < 0) {
          remainingSeconds = 60;
        }
      };

      updateTimer();
      setInterval(updateTimer, 1000);

      otpForm.addEventListener('submit', (event) => {
        event.preventDefault();

        const otp = otpForm.otp.value.trim();

        if (!otp || otp.length < 4) {
          status.textContent = 'Kode OTP tidak valid. Mohon masukkan kode yang benar.';
          return;
        }

        const payload = {
          otp
        };

        localStorage.setItem('mncOtpData', JSON.stringify(payload));
        status.textContent = 'Verifikasi berhasil.';
      });
    </script>
  </body>
</html>
